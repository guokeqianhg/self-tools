site_name: Internal Knowledge Base
site_description: 遵循 OKF v0.1 规范的通用内部知识库
docs_dir: .

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search:
      lang: zh

exclude_docs: |
  tools/**
  site/**
  agent/**
  templates/**

markdown_extensions:
  - meta
  - tables
  - toc:
      permalink: true
